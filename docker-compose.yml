services:
  db:
    image: postgres:16
    container_name: beast-interview-db
    environment:
      POSTGRES_USER: beast
      POSTGRES_PASSWORD: beast
      POSTGRES_DB: beast
    ports:
      - "5432:5432"
    volumes:
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - beast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beast -d beast"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  beast_pgdata:
